name: 🎮 HnHost 每日领取金币

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  claim:
    name: 🪙 执行每日领币
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: write
      contents: read

    steps:
      - name: 📥 拉取私库代码
        uses: actions/checkout@v4
        with:
          repository: kanezikii/HnHost-Claim
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 🟢 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 安装依赖
        working-directory: private
        run: npm install undici @playwright/test

      - name: 🌐 安装 Playwright 浏览器
        working-directory: private
        run: npx playwright install chromium --with-deps

      # =========================================
      # 🔥 核心修改：使用 Xray-core 替换旧版 GOST
      # =========================================
      - name: 🛡️ 启动 Xray 代理转发
        env:
          XRAY_CONFIG: ${{ secrets.XRAY_CONFIG }}
        run: |
          # 1. 下载 Xray-core (固定版本)
          XRAY_VERSION="v1.8.24"
          echo "📦 Xray 版本: $XRAY_VERSION"
          wget -q "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q Xray-linux-64.zip -d xray_bin
          chmod +x xray_bin/xray
          
          # 2. 写入配置，并自动将 Xray 不支持的 "mixed" 协议替换为 "socks"
          echo "$XRAY_CONFIG" > xray_bin/config.json
          sed -i 's/"protocol": "mixed"/"protocol": "socks"/g' xray_bin/config.json
          
          # 3. 后台启动 Xray
          nohup ./xray_bin/xray -c ./xray_bin/config.json > xray.log 2>&1 &
          
          # 4. 等待 3 秒让 Xray 启动完毕
          sleep 3
          
          # 5. 验证代理是否成功运行。如果失败，直接打印错误日志并阻断工作流。
          if ! curl -s -x socks5://127.0.0.1:10808 https://api.ipify.org > /dev/null; then
            echo "❌ 代理连接失败！Xray 可能崩溃了。下面是运行日志："
            cat xray.log
            exit 1
          fi
          
          echo "✅ 代理启动成功！当前出口 IP："
          curl -s -x socks5://127.0.0.1:10808 https://api.ipify.org | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\.\)[0-9]*/\1xx/g'
            
      - name: 🚀 运行领币脚本
        working-directory: private
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT:        ${{ secrets.TG_BOT }}
          # 这里的端口必须和 Xray JSON 中 inbound 监听的端口 (10808) 保持一致
          HTTP_PROXY:    socks5://127.0.0.1:10808
          HTTPS_PROXY:   socks5://127.0.0.1:10808
        run: npx playwright test tests/hnhost-claim.spec.js

      - name: 📸 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: private/test-results/
          retention-days: 7
          
      - name: 🧹 清理历史工作流记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1         # 只保留最近 1 天的记录
          keep_minimum_runs: 3   # 至少保留最新的 3 次记录，防止全删光
